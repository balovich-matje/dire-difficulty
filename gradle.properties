# THE single source of version truth for this repo, while it is a single project.
# When it becomes a Stonecutter workspace, everything below the Gradle options moves to
# stonecutter.properties.toml and only the two `org.gradle.*` lines stay here — see the
# note in the sibling repos' gradle.properties about R-01 (`loomx.loom_version` must never
# live in a file every node's buildscript reads).

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# ---- Toolchain (pinned to the other two repos) ----
# 26.2 is unobfuscated, so this is plain `net.fabricmc.fabric-loom`, not the
# `fabric-loom-remap` variant the legacy nodes over there need. NO YARN: Mojang official
# mappings are the names 26.2 already ships with, so no `mappings` dependency is declared
# at all (proven by the pre-Stonecutter Skill Proficiencies build, commit eb16e17).
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.17

# ---- Mod properties ----
# `mod_id` is PERMANENT (docs/DESIGN.md §7.5) and must survive any later rename of the
# display name. Namespace, attachment keys, payload channels, the source directory and
# rootProject.name are all stamped from it.
mod_id=escalation
mod_name=Advanced Difficulty Settings
mod_version=0.1.0
maven_group=com.escalation

# The Minecraft/loader/java floors written into fabric.mod.json.
minecraft_compat=~26.2
loader_floor=>=0.19.3
java_floor=25

# ---- Dependencies ----
fabric_api_version=0.155.2+26.2

# Optional config UI (compile + dev runtime only; soft deps at runtime).
modmenu_version=20.0.1
cloth_config_version=26.2.155+fabric
